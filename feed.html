<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feed — Byron.Verona</title>

  <!-- Comic data — same source as the main site -->
  <script src="comics.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #1515CC;
      --white: #ffffff;
    }

    body {
      background: var(--white);
      color: var(--blue);
      font-family: 'VT323', monospace;
      font-size: 18px;
    }

    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }

    header {
      border-bottom: 2px solid var(--blue);
      padding: 14px 24px;
      display: flex;
      align-items: baseline;
      gap: 20px;
      flex-wrap: wrap;
    }
    .site-title { font-size: 34px; letter-spacing: 0.04em; }
    .site-sub   { font-size: 16px; opacity: 0.6; }
    header nav  { margin-left: auto; display: flex; gap: 20px; font-size: 17px; }

    main {
      max-width: 780px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    h1 { font-size: 30px; margin-bottom: 8px; letter-spacing: 0.02em; }
    .feed-sub {
      font-size: 16px;
      opacity: 0.6;
      margin-bottom: 28px;
    }

    .dither-bar {
      height: 12px;
      background-image: radial-gradient(var(--blue) 1.2px, transparent 1.2px);
      background-size: 5px 5px;
      margin: 28px 0;
    }

    /* RSS hint box */
    .rss-hint {
      border: 2px solid var(--blue);
      padding: 14px 18px;
      font-size: 16px;
      line-height: 2;
      margin-bottom: 32px;
    }
    .rss-hint code {
      background: var(--blue);
      color: var(--white);
      padding: 2px 7px;
      font-family: monospace;
      font-size: 15px;
      word-break: break-all;
    }

    /* Feed entries */
    .feed-entry {
      border: 2px solid var(--blue);
      margin-bottom: 28px;
    }
    .entry-header {
      display: flex;
      align-items: baseline;
      gap: 16px;
      padding: 10px 16px;
      border-bottom: 2px solid var(--blue);
      flex-wrap: wrap;
    }
    .entry-num   { font-size: 16px; opacity: 0.5; flex-shrink: 0; }
    .entry-title { font-size: 22px; flex: 1; }
    .entry-date  { font-size: 15px; opacity: 0.6; flex-shrink: 0; }

    .entry-img {
      display: block;
      width: 100%;
      height: auto;
      border-bottom: 2px solid var(--blue);
      background: #f5f5ff;
    }
    /* placeholder shown when image hasn't loaded yet */
    .entry-img-wrap {
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 2px solid var(--blue);
      background: #f5f5ff;
      position: relative;
    }
    .entry-img-wrap img { display: block; width: 100%; height: auto; }

    .entry-alt {
      padding: 10px 16px;
      font-size: 16px;
      line-height: 1.8;
      opacity: 0.75;
      border-bottom: 2px solid var(--blue);
      font-style: italic;
    }
    .entry-footer {
      padding: 8px 16px;
      font-size: 15px;
      opacity: 0.65;
      display: flex;
      gap: 20px;
    }
    .entry-footer a { opacity: 1; }

    footer {
      border-top: 2px solid var(--blue);
      padding: 16px 24px;
      font-size: 15px;
      line-height: 2.4;
      opacity: 0.7;
      margin-top: 40px;
    }
  </style>
</head>
<body>

<header>
  <a href="index.html" class="site-title">Byron.Verona</a>
  <span class="site-sub">a daily webcomic</span>
  <nav>
    <a href="index.html#archive">Archive</a>
    <a href="about.html">About</a>
    <a href="feed.html">Feed</a>
  </nav>
</header>

<main>
  <h1>Feed</h1>
  <div class="feed-sub">Latest comics — newest first</div>

  <div class="rss-hint">
    Want this in your RSS reader?<br>
    Add this URL: <code id="rssUrl"></code><br>
    <span style="font-size:15px;opacity:0.7;">
      Works with Feedly, NetNewsWire, Reeder, and any RSS app.
    </span>
  </div>

  <div class="dither-bar"></div>

  <div id="feedEntries"></div>
</main>

<footer>
  Byron.Verona — updated twice daily. Blue ink. Dithered dreams.<br>
  <a href="feed.html">RSS Feed</a> &nbsp;·&nbsp;
  <a href="about.html">About</a> &nbsp;·&nbsp;
  Licensed under <a href="https://creativecommons.org/licenses/by-nc/2.5/" target="_blank">CC BY-NC 2.5</a>
</footer>

<script>
  // Show the current page's origin as the RSS URL
  const base = window.location.origin + window.location.pathname.replace('feed.html', '');
  document.getElementById('rssUrl').textContent = base + 'feed.xml';

  // Sort newest first
  const sorted = [...COMICS].sort((a, b) => b.id - a.id);

  const container = document.getElementById('feedEntries');

  sorted.forEach(c => {
    const entry = document.createElement('div');
    entry.className = 'feed-entry';

    const comicUrl = `index.html?id=${c.id}`;

    entry.innerHTML = `
      <div class="entry-header">
        <span class="entry-num">#${String(c.id).padStart(3, '0')}</span>
        <span class="entry-title"><a href="${comicUrl}">${c.title}</a></span>
        <span class="entry-date">${c.date}</span>
      </div>
      <div class="entry-img-wrap">
        <img src="${c.image}" alt="${c.title}" loading="lazy" />
      </div>
      <div class="entry-alt">"${c.alt}"</div>
      <div class="entry-footer">
        <a href="${comicUrl}">Permalink</a>
        <a href="${c.image}" target="_blank">Image</a>
      </div>
    `;

    container.appendChild(entry);
  });
</script>

</body>
</html>
