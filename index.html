<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Byron.Verona</title>
  <meta name="description" content="Byron.Verona — a daily webcomic." />

  <!-- Comic data — edit this file to add new comics -->
  <script src="comics.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #1515CC;
      --white: #ffffff;
    }

    body {
      background: var(--white);
      color: var(--blue);
      font-family: 'VT323', monospace;
      font-size: 18px;
    }

    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── HEADER ── */
    header {
      border-bottom: 2px solid var(--blue);
      padding: 14px 24px;
      display: flex;
      align-items: baseline;
      gap: 20px;
      flex-wrap: wrap;
    }
    .site-title { font-size: 34px; letter-spacing: 0.04em; }
    .site-sub   { font-size: 16px; opacity: 0.6; }
    header nav  { margin-left: auto; display: flex; gap: 20px; font-size: 17px; }

    /* ── MAIN CONTENT ── */
    main {
      max-width: 780px;
      margin: 0 auto;
      padding: 28px 24px;
    }

    /* ── COMIC TITLE ── */
    #comicTitle { font-size: 30px; margin-bottom: 16px; letter-spacing: 0.02em; }

    /* ── COMIC IMAGE FRAME ── */
    .comic-frame {
      border: 2px solid var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 200px;
      position: relative;
      overflow: hidden;
      background: var(--white);
    }
    .comic-frame img {
      display: block;
      max-width: 100%;
      height: auto;
    }
    /* Alt/flavor text tooltip — appears on hover like xkcd */
    .alt-tooltip {
      display: none;
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: var(--blue);
      color: var(--white);
      font-size: 16px;
      padding: 8px 12px;
      line-height: 1.5;
    }
    .comic-frame:hover .alt-tooltip { display: block; }

    /* ── NAVIGATION ── */
    .nav-strip {
      display: flex;
      margin-top: 16px;
      border: 2px solid var(--blue);
      width: fit-content;
    }
    .nav-strip button {
      font-family: 'VT323', monospace;
      font-size: 18px;
      background: none;
      border: none;
      border-right: 2px solid var(--blue);
      color: var(--blue);
      padding: 7px 18px;
      cursor: pointer;
    }
    .nav-strip button:last-child { border-right: none; }
    .nav-strip button:hover     { background: var(--blue); color: var(--white); }
    .nav-strip button:disabled  { opacity: 0.3; cursor: default; }
    .nav-strip button:disabled:hover { background: none; color: var(--blue); }

    /* ── META LINKS ── */
    .meta {
      margin-top: 16px;
      font-size: 16px;
      line-height: 2.2;
      opacity: 0.72;
    }
    .meta a { opacity: 1; }

    /* ── DITHER DIVIDER ── */
    .dither-bar {
      height: 12px;
      background-image: radial-gradient(var(--blue) 1.2px, transparent 1.2px);
      background-size: 5px 5px;
      margin: 32px 0;
    }

    /* ── ARCHIVE ── */
    .archive-title { font-size: 26px; margin-bottom: 12px; }
    .archive-grid  { border: 2px solid var(--blue); }
    .archive-row {
      display: flex;
      align-items: baseline;
      gap: 16px;
      padding: 7px 14px;
      border-bottom: 1px solid var(--blue);
      cursor: pointer;
      font-size: 18px;
    }
    .archive-row:last-child { border-bottom: none; }
    .archive-row:hover { background: var(--blue); color: var(--white); }
    .archive-row:hover a { color: var(--white); }
    .archive-num  { width: 52px; opacity: 0.5; font-size: 16px; flex-shrink: 0; }
    .archive-date { width: 110px; opacity: 0.6; font-size: 15px; flex-shrink: 0; }

    /* ── SHARE STRIP ── */
    .share-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      margin-top: 12px;
      border: 2px solid var(--blue);
      width: fit-content;
      font-size: 15px;
    }
    .share-btn {
      font-family: 'VT323', monospace;
      font-size: 15px;
      background: none;
      border: none;
      border-right: 2px solid var(--blue);
      color: var(--blue);
      padding: 5px 13px;
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
      display: inline-block;
      line-height: 1.8;
    }
    .share-btn:last-child { border-right: none; }
    .share-btn:hover { background: var(--blue); color: var(--white); text-decoration: none; }
    .share-btn.copied { background: var(--blue); color: var(--white); }
    .share-label {
      font-size: 14px;
      opacity: 0.55;
      margin-top: 5px;
      margin-bottom: 2px;
    }

    /* ── MUSIC PLAYER ── */
    #musicBtn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 999;
      font-family: 'VT323', monospace;
      font-size: 16px;
      background: var(--white);
      color: var(--blue);
      border: 2px solid var(--blue);
      padding: 8px 14px;
      cursor: pointer;
      line-height: 1.4;
      text-align: center;
      min-width: 90px;
      box-shadow: 3px 3px 0 var(--blue);
    }
    #musicBtn:hover { background: var(--blue); color: var(--white); }
    #musicBtn.playing { background: var(--blue); color: var(--white); }

    /* ── FOOTER ── */
    footer {
      border-top: 2px solid var(--blue);
      padding: 16px 24px;
      font-size: 15px;
      line-height: 2.4;
      opacity: 0.7;
      margin-top: 40px;
    }
  </style>
</head>
<body>

<header>
  <span class="site-title">Byron.Verona</span>
  <span class="site-sub">a daily webcomic</span>
  <nav>
    <a href="#archive">Archive</a>
    <a href="about.html">About</a>
    <a href="feed.html">Feed</a>
  </nav>
</header>

<main>

  <!-- COMIC TITLE -->
  <div id="comicTitle"></div>

  <!-- COMIC IMAGE -->
  <div class="comic-frame" id="comicFrame">
    <img id="comicImg" src="" alt="" />
    <div class="alt-tooltip" id="altTooltip"></div>
  </div>

  <!-- NAVIGATION: |< Prev · Random · Next · >| -->
  <div class="nav-strip">
    <button id="btnFirst"  title="First comic">|&lt;</button>
    <button id="btnPrev"   title="Previous comic">&lt; Prev</button>
    <button id="btnRandom" title="Random comic">Random</button>
    <button id="btnNext"   title="Next comic">Next &gt;</button>
    <button id="btnLast"   title="Latest comic">&gt;|</button>
  </div>

  <!-- SHARE STRIP -->
  <div class="share-label">Share this comic:</div>
  <div class="share-strip" id="shareStrip">
    <button class="share-btn" id="shareCopy">⎘ Copy Link</button>
    <a  class="share-btn" id="shareTwitter" target="_blank" rel="noopener">𝕏 Twitter</a>
    <a  class="share-btn" id="shareBluesky" target="_blank" rel="noopener">🦋 Bluesky</a>
    <a  class="share-btn" id="shareTumblr"  target="_blank" rel="noopener">Tumblr</a>
    <a  class="share-btn" id="shareReddit"  target="_blank" rel="noopener">Reddit</a>
    <button class="share-btn" id="shareIG">📷 Instagram*</button>
    <button class="share-btn" id="shareTT">♪ TikTok*</button>
  </div>

  <!-- PERMANENT LINK + IMAGE URL (like xkcd) -->
  <div class="meta" id="comicMeta"></div>

  <div class="dither-bar"></div>

  <!-- ARCHIVE -->
  <div id="archive">
    <div class="archive-title">Archive</div>
    <div class="archive-grid" id="archiveGrid"></div>
  </div>

</main>

<footer>
  Byron.Verona — updated twice daily. Blue ink. Dithered dreams.<br>
  <a href="feed.html">RSS Feed</a> &nbsp;·&nbsp;
  <a href="about.html">About</a> &nbsp;·&nbsp;
  Licensed under <a href="https://creativecommons.org/licenses/by-nc/2.5/" target="_blank">CC BY-NC 2.5</a>
</footer>

<!-- BACKGROUND MUSIC -->
<audio id="bgAudio" loop preload="auto"></audio>

<!-- STICKY MUSIC BUTTON -->
<button id="musicBtn" title="Toggle background music">▶ Music</button>
  
<script>
// ── SORT: newest first (highest id = index 0) ───────────────────────────────
// COMICS is loaded from comics.js — it's already newest-first, but we sort
// defensively so order in the file doesn't matter.
const sorted = [...COMICS].sort((a, b) => b.id - a.id);

// current index into `sorted` (0 = latest)
let current = 0;

// ── RENDER ──────────────────────────────────────────────────────────────────
function render() {
  const c = sorted[current];

  // Title
  document.title = `Byron.Verona — ${c.title}`;
  document.getElementById('comicTitle').textContent = c.title;

  // Image + alt tooltip
  const img = document.getElementById('comicImg');
  img.src = c.image;
  img.alt = c.title;
  document.getElementById('altTooltip').textContent = c.alt;
  document.getElementById('comicFrame').title = c.alt;

  // Meta links
  const slug = c.title.toLowerCase().replace(/[^a-z0-9]+/g, '-');
  document.getElementById('comicMeta').innerHTML =
    `Permanent link to this comic: <a href="?id=${c.id}">#${c.id} — ${c.title}</a><br>` +
    `Image URL: <a href="${c.image}" target="_blank">${c.image}</a>`;

  // Button states
  document.getElementById('btnFirst').disabled  = current === sorted.length - 1;
  document.getElementById('btnPrev').disabled   = current === sorted.length - 1;
  document.getElementById('btnNext').disabled   = current === 0;
  document.getElementById('btnLast').disabled   = current === 0;

  // Rebuild archive highlight
  buildArchive();

  // Update share links for this comic
  updateShareLinks();

  // Update URL without reloading (so links are shareable)
  history.replaceState(null, '', `?id=${c.id}`);
}

// ── ARCHIVE ─────────────────────────────────────────────────────────────────
function buildArchive() {
  const grid = document.getElementById('archiveGrid');
  grid.innerHTML = '';
  sorted.forEach((c, i) => {
    const row = document.createElement('div');
    row.className = 'archive-row';
    if (i === current) row.style.background = 'var(--blue)';
    if (i === current) row.style.color = 'var(--white)';
    row.innerHTML =
      `<span class="archive-num">#${String(c.id).padStart(3, '0')}</span>` +
      `<span class="archive-date">${c.date}</span>` +
      `<span>${c.title}</span>`;
    row.addEventListener('click', () => {
      current = i;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    grid.appendChild(row);
  });
}

// ── NAV BUTTONS ─────────────────────────────────────────────────────────────
document.getElementById('btnFirst').addEventListener('click', () => {
  current = sorted.length - 1; render();
});
document.getElementById('btnPrev').addEventListener('click', () => {
  if (current < sorted.length - 1) { current++; render(); }
});
document.getElementById('btnNext').addEventListener('click', () => {
  if (current > 0) { current--; render(); }
});
document.getElementById('btnLast').addEventListener('click', () => {
  current = 0; render();
});
document.getElementById('btnRandom').addEventListener('click', () => {
  current = Math.floor(Math.random() * sorted.length); render();
});

// ── SHARE ────────────────────────────────────────────────────────────────────
function getShareURL() {
  return window.location.origin + window.location.pathname + '?id=' + sorted[current].id;
}
function getShareText() {
  return `"${sorted[current].title}" — Byron.Verona webcomic`;
}

// Copy link (also used for Instagram & TikTok fallback)
function copyLink(btn) {
  navigator.clipboard.writeText(getShareURL()).then(() => {
    const orig = btn.textContent;
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1800);
  });
}

document.getElementById('shareCopy').addEventListener('click', function () {
  copyLink(this);
});

document.getElementById('shareIG').addEventListener('click', function () {
  copyLink(this);
  // brief label change to explain
  setTimeout(() => { this.textContent = '📷 Instagram*'; }, 1800);
  this.textContent = '✓ Copied — paste into IG!';
});

document.getElementById('shareTT').addEventListener('click', function () {
  copyLink(this);
  setTimeout(() => { this.textContent = '♪ TikTok*'; }, 1800);
  this.textContent = '✓ Copied — paste into TikTok!';
});

// Update all share links when comic changes — called inside render()
function updateShareLinks() {
  const url  = encodeURIComponent(getShareURL());
  const text = encodeURIComponent(getShareText());
  const title = encodeURIComponent(sorted[current].title);

  document.getElementById('shareTwitter').href =
    `https://twitter.com/intent/tweet?url=${url}&text=${text}`;

  document.getElementById('shareBluesky').href =
    `https://bsky.app/intent/compose?text=${text}%20${url}`;

  document.getElementById('shareTumblr').href =
    `https://www.tumblr.com/share/link?url=${url}&name=${title}`;

  document.getElementById('shareReddit').href =
    `https://www.reddit.com/submit?url=${url}&title=${text}`;
}

// ── MUSIC ────────────────────────────────────────────────────────────────────
const audio    = document.getElementById('bgAudio');
const musicBtn = document.getElementById('musicBtn');
let   playing  = false;

// Build path relative to wherever index.html lives — works on GitHub Pages subfolders
const mp3Path = window.location.pathname.replace(/\/[^/]*$/, '/') + 'Narutos_Daily_Life.mp3';
audio.src = mp3Path;

musicBtn.addEventListener('click', () => {
  if (playing) {
    audio.pause();
    musicBtn.textContent = '▶ Music';
    musicBtn.classList.remove('playing');
    playing = false;
  } else {
    const playPromise = audio.play();
    if (playPromise !== undefined) {
      playPromise.then(() => {
        musicBtn.textContent = '⏸ Music';
        musicBtn.classList.add('playing');
        playing = true;
      }).catch(() => {
        musicBtn.textContent = '✗ No audio file';
      });
    }
  }
});

// If audio ends unexpectedly (shouldn't since loop=true, but just in case)
audio.addEventListener('ended', () => {
  audio.play();
});

// Reset button if audio errors (e.g. file not found)
audio.addEventListener('error', () => {
  musicBtn.textContent = '✗ File not found';
  playing = false;
});
// If someone visits ?id=3 they land directly on that comic.
(function () {
  const params = new URLSearchParams(window.location.search);
  const id = parseInt(params.get('id'), 10);
  if (!isNaN(id)) {
    const idx = sorted.findIndex(c => c.id === id);
    if (idx !== -1) current = idx;
  }
  render();
})();
</script>


</body>
</html>
